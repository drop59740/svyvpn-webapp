<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e18">
<title>SvyVPN — тарифы</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">

<style>
:root{
  --bg:        #0a0e18;
  --bg-2:      #0d121e;
  --surface:   #111827;
  --surface-2: #16202f;
  --surface-3: #1a2438;
  --border:    #1e2a3e;
  --border-hi: #2a3a55;

  --text:      #f0f4fc;
  --text-mut:  #8a94a8;
  --text-dim:  #5a6580;

  --accent:      #3ea6ff;
  --accent-2:    #5cb8ff;
  --accent-dim:  #1d4166;
  --accent-bg:   #0e1f33;
  --accent-glow: rgba(62,166,255,.35);

  --yellow:    #ffc93c;
  --green:     #4ade80;

  --r-sm: 8px;
  --r:    14px;
  --r-lg: 20px;

  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-bounce: cubic-bezier(.34,1.56,.64,1);

  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{
  font-family:"Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-feature-settings: "ss01","cv11","tnum";
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 900px 600px at 50% -10%, rgba(62,166,255,.15), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(62,166,255,.06), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  overscroll-behavior-y: none;
  min-height: 100dvh;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
::selection{background: var(--accent); color: var(--bg)}

/* Иконка звезды (вместо emoji ⭐) */
.ico-star{
  width: 1em;
  height: 1em;
  display: inline-block;
  vertical-align: -0.14em;
  flex: 0 0 auto;
  color: var(--yellow);
  filter: drop-shadow(0 0 6px rgba(255,201,60,.35));
}

.app{
  max-width: 460px;
  margin-inline: auto;
  padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 32px);
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ── HEADER ── */
.header{
  display:flex; align-items:center; gap:12px;
  padding: 4px 0;
}
.brand-mark{
  width:42px; height:42px; flex:0 0 auto;
  filter: drop-shadow(0 4px 14px rgba(62,166,255,.4));
}
.brand-text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.brand-name{
  font-weight:800; font-size:16px; letter-spacing:-.02em;
  display:flex; align-items:baseline; gap:2px;
}
.brand-name em{ font-style:normal; color: var(--accent); font-size:13px; font-weight:700; }
.brand-tag{ font-size:12px; color: var(--text-dim); letter-spacing:-.005em; }

/* ── HEAD ── */
.head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-top: 4px; }
.title{
  font-size: 30px;
  letter-spacing: -.04em;
  font-weight: 800;
  line-height: 1.05;
  background: linear-gradient(180deg, #fff, #b8c4dc);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle{
  margin-top: 7px;
  font-size: 13px;
  color: var(--text-mut);
  max-width: 30ch;
  letter-spacing: -.005em;
}
.tail{
  display:inline-flex; align-items:center; gap:6px;
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 700;
  padding-bottom: 5px;
}
.tail .ico-star{
  width: 11px; height: 11px;
  filter: none;
}

/* ── TRIAL ── */
.trial{
  width: 100%;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border-radius: var(--r-lg);
  border: 1px solid transparent;
  background:
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(135deg, var(--accent-dim), var(--border-hi)) border-box;
  text-align: left;
  transition: transform .15s var(--ease), box-shadow .25s var(--ease);
  position: relative;
  overflow: hidden;
}
.trial::before{
  content:'';
  position: absolute;
  inset: 0;
  background: radial-gradient(400px 80px at 20% 0%, rgba(62,166,255,.08), transparent 70%);
  pointer-events: none;
}
.trial:hover{
  transform: translateY(-1px);
  box-shadow: 0 10px 30px -10px rgba(62,166,255,.35);
}
.trial:active{ transform: scale(.985); }

.trial-icon{
  width: 44px; height: 44px;
  border-radius: 13px;
  display: grid; place-items: center;
  color: var(--accent);
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
  position: relative; z-index: 1;
}

.trial-text{ display:flex; flex-direction:column; gap:3px; min-width:0; position: relative; z-index: 1; }
.trial-title{
  font-size: 15px; font-weight: 700; letter-spacing: -.015em;
  color: var(--text);
}
.trial-sub{
  font-size: 12px; color: var(--text-dim); letter-spacing: -.005em;
}

.trial-cta{
  width: 32px; height: 32px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  transition: transform .25s var(--ease-bounce);
  box-shadow: 0 4px 14px -2px var(--accent-glow);
  position: relative; z-index: 1;
}
.trial:hover .trial-cta{ transform: translateX(3px); }

/* ── PLANS ── */
.plans{ display:flex; flex-direction:column; gap: 10px; margin-top: 14px; }

.plan{
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 18px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: var(--surface);
  text-align: left;
  transition:
    border-color .2s var(--ease),
    background .2s var(--ease),
    transform .15s var(--ease),
    box-shadow .25s var(--ease);
  overflow: hidden;
}
.plan:hover{
  border-color: var(--border-hi);
  background: var(--surface-2);
  transform: translateY(-1px);
  box-shadow: 0 12px 32px -16px rgba(0,0,0,.6);
}
.plan:active{ transform: scale(.99); }

.plan-left{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.plan-duration{
  font-size: 15px; font-weight: 700; letter-spacing: -.015em;
  display:flex; align-items:center; gap:8px; flex-wrap: wrap;
  color: var(--text);
}
.plan-badge{
  display:inline-flex; align-items:center;
  padding: 3px 8px;
  font-size: 10px; font-weight: 800;
  letter-spacing: .06em; text-transform: uppercase;
  border-radius: 999px;
  color: var(--accent);
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
}
.plan-badge.neutral{
  color: var(--green);
  background: rgba(74,222,128,.08);
  border-color: rgba(74,222,128,.25);
}
.plan-per{
  font-size: 12px; color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.005em;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.plan-per .ico-star{
  width: 11px; height: 11px;
  filter: none;
  opacity: .85;
}

.plan-right{ display:flex; align-items:center; gap: 12px; }
.plan-price{
  display:inline-flex; align-items: center; gap: 6px;
  font-variant-numeric: tabular-nums;
}
.plan-price .n{
  font-size: 21px; font-weight: 800; letter-spacing: -.03em;
  color: var(--text);
  line-height: 1;
}
.plan-price .ico-star{
  width: 15px; height: 15px;
  opacity: .95;
}

.plan-cta{
  width: 34px; height: 34px;
  border-radius: 50%;
  display:grid; place-items:center;
  background: transparent;
  border: 1px solid var(--border-hi);
  color: var(--text-mut);
  transition: background .2s var(--ease), border-color .2s, color .2s, transform .2s var(--ease-bounce);
}
.plan:hover .plan-cta{
  border-color: var(--accent);
  color: var(--accent);
  transform: translateX(2px);
}

/* HERO PLAN */
.plan[data-hero="true"]{
  border-color: transparent;
  background:
    linear-gradient(180deg, rgba(62,166,255,.10), rgba(62,166,255,.03)) padding-box,
    linear-gradient(135deg, var(--accent-dim), var(--accent), var(--accent-dim)) border-box;
  border: 1.5px solid transparent;
  box-shadow:
    0 0 0 1px rgba(62,166,255,.08),
    0 20px 40px -20px rgba(62,166,255,.35);
}
.plan[data-hero="true"]::before{
  content:'';
  position: absolute;
  top: -50%; right: -30%;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(62,166,255,.18), transparent 70%);
  pointer-events: none;
}
.plan[data-hero="true"]:hover{
  box-shadow:
    0 0 0 1px rgba(62,166,255,.15),
    0 25px 50px -20px rgba(62,166,255,.5);
}
.plan[data-hero="true"] .plan-price .n{ font-size: 24px; }
.plan[data-hero="true"] .plan-price .ico-star{ width: 17px; height: 17px; }
.plan[data-hero="true"] .plan-cta{
  border-color: transparent;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: 0 4px 16px -2px var(--accent-glow);
}
.plan[data-hero="true"]:hover .plan-cta{
  border-color: transparent;
  color: #fff;
}

/* ── FOOTER ── */
.footer{
  margin-top: 6px;
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: -.005em;
}
.footer a{
  color: var(--text-mut);
  display:inline-flex; align-items:center; gap:6px;
  transition: color .2s;
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid transparent;
}
.footer a:hover{
  color: var(--accent);
  border-color: var(--accent-dim);
  background: var(--accent-bg);
}
.footer svg{
  opacity: .9;
}

/* ── TOAST ── */
.toast{
  position: fixed;
  left: 50%; bottom: calc(var(--safe-bottom) + 24px);
  transform: translate(-50%, 20px);
  z-index: 100;
  padding: 12px 18px;
  border-radius: 999px;
  background: rgba(22,32,47,.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-hi);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .35s var(--ease);
  max-width: calc(100vw - 32px);
  text-align: center;
  box-shadow: 0 12px 32px -8px rgba(0,0,0,.6);
}
.toast[data-show="true"]{ opacity: 1; transform: translate(-50%, 0); }

:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* ── REVEAL ── */
[data-reveal]{
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .55s var(--ease), transform .55s var(--ease);
  transition-delay: var(--reveal-delay, 0ms);
}
[data-reveal].in{ opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
  [data-reveal]{ opacity:1!important; transform:none!important; }
}
</style>
</head>

<script>
(() => {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     КОНФИГ
     ══════════════════════════════════════════════════════════ */
  const CONFIG = {
    botUrl:     'https://t.me/svyvpn_bot',
    supportUrl: 'https://t.me/DRDFNS',   // поддержка @DRDFNS
    invoiceLinks: {}                     // опционально: {"1": "https://t.me/$...", ...}
  };

  // Если бот передал invoice-ссылки через query (?l1=&l3=&l12=), подхватываем
  try {
    const p = new URLSearchParams(location.search);
    if (p.get('l1'))  CONFIG.invoiceLinks['1']  = p.get('l1');
    if (p.get('l3'))  CONFIG.invoiceLinks['3']  = p.get('l3');
    if (p.get('l12')) CONFIG.invoiceLinks['12'] = p.get('l12');
  } catch {}

  /* ══════════════════════════════════════════════════════════
     TELEGRAM WEBAPP
     ══════════════════════════════════════════════════════════ */
  const tg = window.Telegram?.WebApp;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (tg) {
    try {
      tg.ready();
      tg.expand?.();
      if ('disableVerticalSwipes' in tg) tg.disableVerticalSwipes();
      tg.setHeaderColor?.('#0a0e18');
      tg.setBackgroundColor?.('#0a0e18');
    } catch {}
  }

  const haptic = {
    tap:     () => tg?.HapticFeedback?.impactOccurred?.('light'),
    success: () => tg?.HapticFeedback?.notificationOccurred?.('success'),
    warn:    () => tg?.HapticFeedback?.notificationOccurred?.('warning'),
    err:     () => tg?.HapticFeedback?.notificationOccurred?.('error'),
  };

  /* ══════════════════════════════════════════════════════════
     REVEAL
     ══════════════════════════════════════════════════════════ */
  if (!reducedMotion && 'IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -6% 0px' });
    document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('[data-reveal]').forEach(el => el.classList.add('in'));
  }

  /* ══════════════════════════════════════════════════════════
     TOAST
     ══════════════════════════════════════════════════════════ */
  const toastEl = document.getElementById('toast');
  let toastT;
  function toast(msg, ttl = 2400) {
    toastEl.textContent = msg;
    toastEl.dataset.show = 'true';
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastEl.dataset.show = 'false'; }, ttl);
  }

  /* ══════════════════════════════════════════════════════════
     ОТПРАВКА ДАННЫХ БОТУ
     ВАЖНО: tg.sendData() вызывается СИНХРОННО, без setTimeout —
     иначе Telegram игнорирует вызов.
     ══════════════════════════════════════════════════════════ */
  function sendToBot(payload, fallbackMsg) {
    if (!tg?.sendData) {
      haptic.warn();
      toast(fallbackMsg);
      return false;
    }
    try {
      tg.sendData(JSON.stringify(payload));
      return true;
    } catch (e) {
      haptic.err();
      toast('Не удалось отправить запрос');
      return false;
    }
  }

  /* ══════════════════════════════════════════════════════════
     TRIAL
     ══════════════════════════════════════════════════════════ */
  document.getElementById('trial-btn')?.addEventListener('click', () => {
    haptic.tap();
    sendToBot(
      { action: 'trial' },
      'Откройте бота, чтобы активировать пробный период'
    );
  });

  /* ══════════════════════════════════════════════════════════
     PLANS
     ══════════════════════════════════════════════════════════ */
  document.querySelectorAll('.plan').forEach(plan => {
    plan.addEventListener('click', () => {
      haptic.tap();

      const months = plan.dataset.months;
      const stars  = plan.dataset.stars;
      const link   = CONFIG.invoiceLinks[months];

      // Вариант 1: есть готовая invoice-ссылка → платим прямо в вебке
      if (link && tg?.openInvoice) {
        tg.openInvoice(link, status => {
          if (status === 'paid')        { haptic.success(); toast(`Оплачено · ${months} мес`); }
          else if (status === 'failed') { haptic.err();     toast('Платёж не прошёл'); }
          else                          { toast('Оплата отменена'); }
        });
        return;
      }

      // Вариант 2 (основной): отправляем выбор боту и закрываем вебку
      sendToBot(
        { action: 'buy', plan: months, stars: Number(stars) },
        'Откройте бота, чтобы оформить подписку'
      );
    });
  });

  /* ══════════════════════════════════════════════════════════
     SUPPORT → @DRDFNS
     ══════════════════════════════════════════════════════════ */
  document.getElementById('support')?.addEventListener('click', e => {
    e.preventDefault();
    haptic.tap();
    const url = CONFIG.supportUrl;
    if (tg?.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, '_blank', 'noopener');
  });
})();
</script>
</body>
</html>
